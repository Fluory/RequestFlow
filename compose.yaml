# Local reference runtime (ADR-0001 D11). Credentials below are LOCAL DEFAULTS for a machine-local
# stack with synthetic data only – override them in `.env`; real environments never use them.
name: requestflow

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: requestflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-dev}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-owner-local-dev}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-rw-local-dev}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d requestflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: chrislusf/seaweedfs:4.47
    # The S3 identity is written from env at start, so no credential file lives in the repo.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=64
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-secret-key}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweed:/data

  # One image, three commands (ADR-0001 D11). Connection data is built from the same env defaults.
  setup:
    build: .
    image: requestflow-app:local
    working_dir: /ops
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/setup.ts"]
    environment: &app-env
      DATABASE_URL: postgres://app_rw:${APP_RW_PASSWORD:-rw-local-dev}@postgres:5432/requestflow
      MIGRATION_DATABASE_URL: postgres://app_owner:${APP_OWNER_PASSWORD:-owner-local-dev}@postgres:5432/requestflow
      S3_ENDPOINT: http://storage:8333
      S3_REGION: eu-central-1
      S3_BUCKET: requestflow-documents
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-secret-key}
      S3_FORCE_PATH_STYLE: "true"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-dev-only-secret-change-me-0123456789}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-local}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8080}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-only-ai-token-0123456789}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    restart: on-failure:5

  web:
    build: .
    image: requestflow-app:local
    environment:
      <<: *app-env
      MIGRATION_DATABASE_URL: ""
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    build: .
    image: requestflow-app:local
    working_dir: /ops
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/worker.ts"]
    environment:
      <<: *app-env
      MIGRATION_DATABASE_URL: ""
    depends_on:
      setup:
        condition: service_completed_successfully

  # AI service (services/ai). Opt-in profile: it refuses to start without Vertex AI credentials
  # (fail-closed, ADR-0001 D8). Without it, processing jobs retry and end in ERROR with a visible cause.
  #   docker compose --profile ai up
  ai:
    build: ./services/ai
    profiles: ["ai"]
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-only-ai-token-0123456789}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-eu}
      VERTEX_MODEL: ${VERTEX_MODEL:-gemini-3.5-flash}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
    volumes:
      - ${GOOGLE_ADC_FILE:-./.secrets/adc.json}:/secrets/adc.json:ro
    ports:
      - "${AI_PORT:-8000}:8080"

volumes:
  pgdata:
  seaweed:
