# Local reference runtime (ADR-0001 D11). Credentials below are LOCAL DEFAULTS for a machine-local
# stack with synthetic data only – override them in `.env`; real environments never use them.
name: requestflow

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: requestflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-dev}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-owner-local-dev}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-rw-local-dev}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requestflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: chrislusf/seaweedfs:4.47
    # The S3 identity is written from env at start, so no credential file lives in the repo.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=64
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-secret-key}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweed:/data

volumes:
  pgdata:
  seaweed:
