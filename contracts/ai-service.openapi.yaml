        message:
          type: string
          title: Message
          description: Short, fixed text. Never contains document content.
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
