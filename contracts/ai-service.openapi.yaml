          - type: 'null'
          title: Error
          description: Why the attachment was not parsed; null when parsed. The message and its other
            attachments are still processed.
        segmentCount:
          type: integer
          minimum: 0.0
          title: Segmentcount
          description: Segments this attachment contributed.
      type: object
      required:
      - path
      - name
      - documentKind
      - status
      - error
      - segmentCount
      title: AttachmentResult
      description: One attachment of an Outlook ``.msg`` (also nested ones), parsed or not.
    BoundingBox:
