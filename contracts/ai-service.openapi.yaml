openapi: 3.1.0
info:
  title: RequestFlow AI service
  description: 'Stateless AI service of RequestFlow (ADR-0001 D8). The TS worker sends one document (PDF
    or RFC 5322 e-mail) plus opaque IDs; the service parses it into segments with stable locators, extracts
    header fields and line items with Gemini on Vertex AI (`eu`) and verifies every quote deterministically.
    The model never has the final say on `found`.


    The service has no database, no storage and no tenant logic. Authentication: bearer token (`AI_SERVICE_TOKEN`)
    on `/v1/extract`; `/healthz` is open.'
  version: 1.0.0
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: Healthz
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/extract:
    post:
      tags:
      - extraction
      summary: Parse one document, extract header fields and line items, verify every quote.
      operationId: extract
      security:
      - bearerAuth: []
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Correlation ID, echoed in the response header and body and in logs. Must match
            ^[A-Za-z0-9._:-]{1,128}$; otherwise the service generates one.
          title: X-Request-Id
        description: Correlation ID, echoed in the response header and body and in logs. Must match ^[A-Za-z0-9._:-]{1,128}$;
          otherwise the service generates one.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
        '400':
          description: Invalid form fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token (checked before the body is read).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '411':
          description: Content-Length header missing or not a number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Document larger than AI_MAX_DOCUMENT_BYTES (declared Content-Length checked before
            the body is read, the file size after).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Not a PDF, RFC 5322 e-mail, Outlook .msg, DOCX or XLSX (e.g. legacy .doc/.xls,
            password-protected Office files, images).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'The document could not be parsed (`document_unparseable`) or is too long (`document_too_long`:
            more pages than AI_MAX_PDF_PAGES, too many rows, text blocks or pages without text to OCR).
            A failing attachment of a .msg does not cause this; it is reported in `attachments`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: All extraction slots busy; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The model call failed or returned invalid output; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AttachmentRef:
      properties:
        index:
          type: integer
          minimum: 0.0
          title: Index
          description: 0-based position among the message's attachments.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: File name as stored in the message (untrusted text).
      type: object
      required:
      - index
      - name
      title: AttachmentRef
    AttachmentResult:
      properties:
        path:
          items:
            type: integer
          type: array
          title: Path
          description: 0-based attachment index per nesting level, outermost first; the last one is `attachment.index`
            in the locators of this attachment's segments.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: File name as stored in the message (untrusted text).
        documentKind:
          anyOf:
          - type: string
            enum:
            - pdf
            - eml
            - xlsx
            - docx
            - msg
          - type: 'null'
