          title: L
        t:
          type: number
          title: T
        r:
          type: number
          title: R
        b:
          type: number
          title: B
      type: object
      required:
      - l
      - t
      - r
      - b
      title: BoundingBox
      description: Box in PDF points; origin top-left of the page (``t`` < ``b``).
    DocxLocator:
      properties:
        kind:
          type: string
          const: docx
          title: Kind
          default: docx
        part:
          type: string
