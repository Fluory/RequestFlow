      type: object
      required:
      - value
      - status
      - evidence
      - modelStatus
      - reason
      title: FieldResult
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    LineItem:
      properties:
        index:
          type: integer
          minimum: 0.0
          title: Index
          description: 0-based position in the document order.
        description:
          $ref: '#/components/schemas/FieldResult'
          description: Product or article; trimmed text.
        quantity:
          $ref: '#/components/schemas/FieldResult'
          description: Quantity as a plain decimal with a dot and no grouping ("1250", "2.5").
