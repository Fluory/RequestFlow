            - textlines
            - layout
          - type: 'null'
          title: Pdfpipeline
          description: PDF pipeline used; null for e-mails.
        tokens:
          $ref: '#/components/schemas/TokenUsage'
        latencyMs:
          type: integer
          title: Latencyms
          description: Server-side time for parse + extract + verify.
        modelLatencyMs:
          anyOf:
          - type: integer
          - type: 'null'
          title: Modellatencyms
          description: Time of the model call; null if skipped.
      type: object
      required:
      - modelId
      - modelVersion
      - promptVersion
      - schemaVersion
      - pdfPipeline
      - tokens
      - latencyMs
      - modelLatencyMs
      title: RunMetadata
    Segment:
      properties:
        id:
          type: string
          title: Id
        text:
          type: string
          title: Text
        locator:
          oneOf:
          - $ref: '#/components/schemas/PdfLocator'
          - $ref: '#/components/schemas/EmailLocator'
          title: Locator
          discriminator:
            propertyName: kind
            mapping:
              email: '#/components/schemas/EmailLocator'
