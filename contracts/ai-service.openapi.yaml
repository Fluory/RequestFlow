              propertyName: kind
              mapping:
                docx: '#/components/schemas/DocxLocator'
                email: '#/components/schemas/EmailLocator'
                msg: '#/components/schemas/MsgLocator'
                pdf: '#/components/schemas/PdfLocator'
                xlsx: '#/components/schemas/XlsxLocator'
          - type: 'null'
          title: Inner
          description: Locator inside the attachment (pdf, xlsx, docx, email or a nested msg) when part=attachment.
      type: object
      required:
      - kind
      - part
      - line
      - header
      - attachment
      - inner
      title: MsgLocator
      description: 'Outlook ``.msg``: headers and body lines like ``email``; attachments wrap their locator.'
    PdfLocator:
      properties:
        kind:
          type: string
          const: pdf
