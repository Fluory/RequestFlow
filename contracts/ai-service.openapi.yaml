          description: Id of a segment in `segments`.
        quote:
          type: string
          title: Quote
          description: Text the model copied from that segment.
      type: object
      required:
      - segmentId
      - quote
      title: Evidence
    ExtractRequest:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: The document bytes (PDF or .eml).
        documentId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
          title: Documentid
          description: Opaque ID from the caller; echoed and logged, never interpreted.
        mediaType:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Mediatype
          description: Declared media type, e.g. message/rfc822. PDF is detected from bytes.
      type: object
      required:
      - file
      - documentId
      title: ExtractRequest
    ExtractResponse:
      properties:
        requestId:
          type: string
          title: Requestid
        documentId:
          type: string
          title: Documentid
        documentKind:
          type: string
          enum:
