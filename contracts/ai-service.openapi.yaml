          type: array
          title: Segments
        fields:
          $ref: '#/components/schemas/ExtractedFields'
        lineItems:
          items:
            $ref: '#/components/schemas/LineItem'
          type: array
          title: Lineitems
          description: Requested positions in document order (schemaVersion 2); empty when none.
        run:
          $ref: '#/components/schemas/RunMetadata'
        warnings:
          items:
            type: string
            const: no_text
          type: array
          title: Warnings
          description: '`no_text`: the document has no text layer (e.g. a scan); no model call made.'
      type: object
      required:
      - requestId
      - documentId
      - documentKind
      - segments
      - fields
      - lineItems
      - run
      - warnings
      title: ExtractResponse
    ExtractedFields:
      properties:
        company:
          $ref: '#/components/schemas/FieldResult'
          description: Requesting company; trimmed text.
        contact_person:
          $ref: '#/components/schemas/FieldResult'
          description: Contact person; trimmed text.
        email:
          $ref: '#/components/schemas/FieldResult'
          description: Requester's e-mail address; lowercased.
        phone:
          $ref: '#/components/schemas/FieldResult'
          description: Requester's phone number; trimmed as written, no country code added.
        requested_delivery_date:
          $ref: '#/components/schemas/FieldResult'
          description: Requested delivery date as YYYY-MM-DD; a calendar week without a date is at most
            `uncertain` (reason `calendar_week_only`, value `KW 42` or `KW 42/2026`).
        additional_requirements:
          $ref: '#/components/schemas/FieldResult'
          description: Additional requirements (certificates, tolerances, ...); trimmed text.
      type: object
      required:
      - company
      - contact_person
      - email
      - phone
      - requested_delivery_date
      - additional_requirements
      title: ExtractedFields
      description: Field keys are fixed snake_case identifiers shared with the TS side.
    FieldResult:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: 'Extracted value. For `found` and verified `uncertain` it is normalised: trimmed
            text; dates as YYYY-MM-DD (a calendar week without a date stays a week, see `reason` `calendar_week_only`);
            quantities as a plain decimal with a dot and no grouping ("1250", "2.5"); units canonical
            (mm, cm, m, kg, t, pcs) or trimmed text for other units; e-mail lowercased; phone trimmed
            as written (no country code added). Kept as the model sent it for `unverified` (and for `uncertain`
            without evidence) so a human can review the proposal; null for `missing`.'
        status:
          type: string
          enum:
          - found
          - uncertain
          - missing
          - unverified
          title: Status
          description: Final status after verification. `found` only if the verifier confirmed the quote
            in the cited segment and the value against the quote.
        evidence:
          anyOf:
          - $ref: '#/components/schemas/Evidence'
          - type: 'null'
        modelStatus:
          type: string
          enum:
          - found
          - uncertain
          - missing
          title: Modelstatus
          description: What the model claimed before verification.
        reason:
          anyOf:
          - type: string
            enum:
            - missing_with_value
            - no_value
            - no_evidence
            - unknown_segment
            - empty_quote
            - quote_not_in_segment
            - value_not_in_quote
            - ambiguous_quote
            - calendar_week_only
          - type: 'null'
          title: Reason
          description: 'Why the verifier set `unverified`; for `uncertain`: `ambiguous_quote` when it
            downgraded `found` (the quote holds several dates) or `calendar_week_only` when a date field
            only has a calendar week (value then `KW <week>` or `KW <week>/<year>`, never a computed date);
            null otherwise.'
      type: object
      required:
      - value
      - status
      - evidence
      - modelStatus
      - reason
      title: FieldResult
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    LineItem:
      properties:
        index:
          type: integer
          minimum: 0.0
          title: Index
          description: 0-based position in the document order.
        description:
          $ref: '#/components/schemas/FieldResult'
          description: Product or article; trimmed text.
        quantity:
          $ref: '#/components/schemas/FieldResult'
          description: Quantity as a plain decimal with a dot and no grouping ("1250", "2.5").
        unit:
          $ref: '#/components/schemas/FieldResult'
          description: 'Unit: one of mm, cm, m, kg, t, pcs (Stk., St., Stueck -> pcs) when known; otherwise
            the unit as written, trimmed.'
        material:
          $ref: '#/components/schemas/FieldResult'
          description: Material or material number; trimmed text.
        dimensions:
          $ref: '#/components/schemas/FieldResult'
          description: Dimensions or nominal size; trimmed text.
      type: object
      required:
      - index
      - description
      - quantity
      - unit
      - material
      - dimensions
      title: LineItem
      description: One requested position; every field is verified on its own (same rules as header fields).
    PdfLocator:
      properties:
        kind:
          type: string
          const: pdf
          title: Kind
          default: pdf
        page:
          type: integer
          minimum: 1.0
          title: Page
          description: 1-based page number.
        bbox:
          $ref: '#/components/schemas/BoundingBox'
        coordOrigin:
          type: string
          const: TOPLEFT
          title: Coordorigin
          default: TOPLEFT
      type: object
      required:
      - kind
      - page
      - bbox
      - coordOrigin
      title: PdfLocator
    RunMetadata:
      properties:
        modelId:
          type: string
          title: Modelid
        modelVersion:
          anyOf:
          - type: string
          - type: 'null'
          title: Modelversion
          description: Model version reported by the provider.
        promptVersion:
          type: string
          title: Promptversion
        schemaVersion:
          type: string
          title: Schemaversion
        pdfPipeline:
          anyOf:
          - type: string
