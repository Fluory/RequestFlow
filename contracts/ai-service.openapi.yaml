          title: Reason
          description: 'Why the verifier set `unverified`; for `uncertain`: `ambiguous_quote` when it
            downgraded `found` (the quote holds several dates), `calendar_week_only` when a date field
            only has a calendar week (value then `KW <week>` or `KW <week>/<year>`, never a computed date)
