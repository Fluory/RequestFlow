        table:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Table
          description: 1-based table index in the body.
        row:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Row
          description: 1-based row in the table.
        cell:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Cell
          description: 1-based grid column where the cell starts (a merged cell counts once).
      type: object
      required:
      - kind
      - part
      - paragraph
      - table
      - row
      - cell
      title: DocxLocator
      description: A body paragraph (``part=paragraph``) or one table cell (``part=table_cell``).
    EmailLocator:
      properties:
        kind:
          type: string
          const: email
          title: Kind
          default: email
        part:
          type: string
          enum:
