      - text
      - locator
      title: Segment
    TokenUsage:
      properties:
        inputTokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Inputtokens
        outputTokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Outputtokens
        totalTokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Totaltokens
      type: object
      required:
      - inputTokens
      - outputTokens
      - totalTokens
      title: TokenUsage
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
