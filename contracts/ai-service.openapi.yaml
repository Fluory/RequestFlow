            - attachment_failed
            - ocr_pages_skipped
          type: array
          title: Warnings
          description: '`no_text`: the document has no text (e.g. a scan without OCR); no model call made.
            `attachment_failed`: at least one attachment of a `.msg` could not be parsed (see `attachments`);
