          type: array
          title: Attachments
          description: Attachments of an Outlook `.msg`, flattened in document order (nested ones after
            their parent); empty for other kinds.
      type: object
      required:
      - requestId
      - documentId
      - documentKind
      - segments
      - fields
      - lineItems
      - run
      - warnings
      title: ExtractResponse
    ExtractedFields:
      properties:
        company:
          $ref: '#/components/schemas/FieldResult'
