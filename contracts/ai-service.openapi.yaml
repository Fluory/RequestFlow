    FieldResult:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: 'Extracted value. For `found` and verified `uncertain` it is normalised: trimmed
            text; dates as YYYY-MM-DD (a calendar week without a date stays a week, see `reason` `calendar_week_only`);
            quantities as a plain decimal with a dot and no grouping ("1250", "2.5"); units canonical
