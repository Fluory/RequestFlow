        header:
          anyOf:
          - type: string
          - type: 'null'
          title: Header
          description: Header name when part=header.
      type: object
      required:
      - kind
      - part
      - line
      - header
      title: EmailLocator
    ErrorDetail:
      properties:
        code:
          type: string
          enum:
          - invalid_request
          - unauthorized
          - length_required
          - document_too_large
          - unsupported_media_type
          - document_unparseable
          - document_too_long
          - busy
          - model_error
          - model_output_invalid
          - internal_error
          title: Code
        message:
          type: string
          title: Message
          description: Short, fixed text. Never contains document content.
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        requestId:
          anyOf:
          - type: string
          - type: 'null'
          title: Requestid
