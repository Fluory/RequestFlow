          description: Range of the non-empty cells of the row, e.g. "A7:D7" (or "B7" for one cell).
      type: object
      required:
      - kind
      - sheet
      - row
      - cellRange
      title: XlsxLocator
      description: 'One spreadsheet row: its non-empty cells are joined with `` | `` in the segment text.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
