[project]
name = "requestflow-ai"
version = "0.1.0"
description = "Stateless RequestFlow AI service: parse -> extract -> verify (ADR-0001 D8)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "docling==2.130.0",
  "fastapi==0.141.1",
  "google-auth==2.58.0",
  "google-genai==2.25.0",
  # Office and Outlook formats (issue #23). Already installed through docling[standard]; pinned
  # directly because the parsers import them (cell/paragraph locators, .msg attachments).
  "olefile==0.47",
  "openpyxl==3.1.5",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "python-oxmsg==0.0.2",
  "uvicorn==0.53.0",
  # docling pulls torch for its layout/table/OCR models. Pinned to the CPU-only wheels below.
  "torch==2.14.0",
  "torchvision==0.29.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "reportlab==5.0.1",
  "ruff==0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/requestflow_ai"]

# CPU-only torch: the service has no GPU; the default PyPI Linux wheels drag in ~3 GB of CUDA.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PTH", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]

[tool.pyright]
include = ["src", "tests", "scripts", "evals"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "docling: runs docling's real converter (model-free PDF path)",
]
